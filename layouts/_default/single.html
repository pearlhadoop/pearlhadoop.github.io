{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ if eq .Section "posts" }}
  <p class="meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    · {{ .ReadingTime }} min read
    {{ with .Params.tags }}· {{ range $i, $t := . }}{{ if $i }}, {{ end }}<a href="{{ "tags/" | relURL }}{{ $t | urlize }}/">#{{ $t }}</a>{{ end }}{{ end }}
  </p>
  {{ end }}
  {{ .Content }}
</article>
{{ end }}
